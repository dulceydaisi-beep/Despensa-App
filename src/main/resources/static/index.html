<!DOCTYPE html>
<html>
<head>

    <title>DespenChain</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            padding:15px;
        }

        h1{
            text-align:center;
        }

        #resumen{
            display:flex;
            gap:10px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .box{
            flex:1;
            min-width:150px;
            color:white;
            padding:15px;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

        .verde{ background:#4CAF50; }
        .azul{ background:#2196F3; }
        .rojo{ background:#f44336; }

        .card{
            background:white;
            padding:20px;
            margin-bottom:18px;
            border-radius:18px;
            box-shadow:0 6px 15px rgba(0,0,0,0.12);
            border-left:6px solid #2196F3 ;
        }

        .nombre{
            font-size:22px;
            font-weight:bold;
            margin-bottom:5px;
        }

        .precio{
            color:green;
            font-size:18px;
            margin-top:5px;
        }

        .stock{
            margin-top:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:8px;
            border:none;
            border-radius:12px;
            color:white;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition: 0.2s;
        }

        .btn-vender{
            background:#e53935;
        }

        .btn-stock{
            background:#43a047;
        }

        .btn-precio{
            background:#1e88e5;
        }
        .btn-eliminar{
            background:#616161;
        }

        .btn-nuevo{
            background:#333;
            margin-bottom:15px;
        }
        .btn-nuevo:hover{
            transform: scale(1.02);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        #mensaje{
            display:none;
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            background:green;
            color:white;
            padding:12px 20px;
            border-radius:8px;
        }

        @media (max-width: 600px) {

            body{
                padding:10px;
            }
            .box{
                min-width: 100%;
            }
            .nombre{
                font-size:20px;
            }

        }

    </style>

</head>

<body>

<h1> DespenChain</h1>

<input
        type="text"
        id="buscar"
        placeholder=" Buscar producto..."
        onkeyup="cargarProductos()"
/>

<div id="mensaje"></div>

<div id="resumen">

    <div class="box verde">
         Productos:
        <span id="totalProductos">0</span>
    </div>

    <div class="box azul">
         Stock:
        <span id="stockTotal">0</span>
    </div>

    <div class="box rojo">
        ️ Bajo:
        <span id="stockBajo">0</span>
    </div>

</div>

<button class="btn-nuevo" onclick="mostrarFormulario()">
     Nuevo Producto
</button>

<div id="formularioProducto"
        style="display:none;background:#222;padding:15px;border-radius:10px;margin-bottom:20px;">
    <h2 style="color:white;">Nuevo Producto</h2>

    <input id="nombre" placeholder="Nombre">
    <input id="categoria" placeholder="Categoria">
    <input id="precio" type="number" placeholder="Precio">
    <input id="stock" type="number" placeholder="Stock">
    <input id="minimo" type="number" placeholder="Stock minimo">

    <button onclick="agregarProducto()"
            style="background:green;color:white;padding:10px;border:none;border-radius:5px;">
        Guardar
    </button>
</div>

<div id="productos"></div>

<script>

    function mostrarMensaje(texto){

        let m = document.getElementById("mensaje");

        m.innerText = texto;
        m.style.display = "block";

        setTimeout(() => {
            m.style.display = "none";
        },1500);
    }
    function mostrarFormulario(){


        let f = document.getElementById("formularioProducto");

        if(f.style.display === "block"){
            f.style.display = "none";
        }else{
            f.style.display = "block";
        }
    }

    function cargarResumen(){

        fetch("/productos/resumen")
            .then(r => r.json())
            .then(data => {

                document.getElementById("totalProductos").innerText = data.totalProductos;
                document.getElementById("stockTotal").innerText = data.stockTotal;
                document.getElementById("stockBajo").innerText = data.stockBajo;

            });
    }

    function cargarProductos(){

        fetch("/productos")
            .then(r => r.json())
            .then(data => {

                let html = "";

                let texto = document
                    .getElementById("buscar")
                    .value
                    .toLowerCase();

                data
                    .filter(p => p.nombre.toLowerCase().includes(texto))

                    .forEach(p => {

                    let estado = "";

                    if(p.stock <= 0){
                        estado = "<span style='color:red;font-weight:bold;'>SIN STOCK</span>";
                    }
                    else if(p.stock <= 5){
                        estado = "<span style='color:orange;font-weight:bold;'>POCO STOCK (" + p.stock + ")</span>";
                    }
                    else{
                        estado = "Stock: " + p.stock;
                    }

                    html += `

                        <div class="card">

                           <div class="nombre">
                                ${p.nombre.toUpperCase()}
                           </div>

                            <div style="
                            display:inline-block;
                            background:#e3f2fd;
                            color:#1565c0;
                             padding:4px 10px;
                             border-radius:20px;
                             font-size:13px;
                             margin-top:5px;
                              ">
                                ${p.categoria}
                            </div>

                            <div class="precio">
                                  $${p.precio}
                            </div>

                            <div class="stock">
                                ${estado}
                            </div>

                            <button class="btn-vender"
                                onclick="vender(${p.id})">
                                Vender
                            </button>

                            <button class="btn-stock"
                                onclick="agregar(${p.id})">
                                + Stock
                            </button>

                            <button class="btn-precio"
                                onclick="editarPrecio(${p.id})">
                                Cambiar Precio
                            </button>
                            <button class="btn-eliminar"
                                onclick="eliminarProducto(${p.id})">
                            Eliminar
                            </button>


                        </div>

                    `;
                });

                document.getElementById("productos").innerHTML = html;

            });
    }

    function vender(id){

        fetch("/productos/vender/" + id,{
            method:"POST"
        })
            .then(() => {

                mostrarMensaje("Venta realizada");

                cargarProductos();
                cargarResumen();

            });
    }

    function agregar(id){

        fetch("/productos/agregar/" + id,{
            method:"POST"
        })
            .then(() => {

                mostrarMensaje("Stock agregado");

                cargarProductos();
                cargarResumen();

            });
    }

    function editarPrecio(id){

        let precio = prompt("Nuevo precio:");

        if(precio){

            fetch("/productos/precio/" + id + "?precio=" + precio,{
                method:"POST"
            })
                .then(() => {

                    mostrarMensaje("Precio actualizado");

                    cargarProductos();

                });
        }
    }

    function guardarProducto(){

        let nombre = document.getElementById("nombre").value;
        let precio = document.getElementById("precio").value;
        let stock = document.getElementById("stock").value;
        let categoria = document.getElementById("categoria").value;

        fetch("/productos/nuevo?nombre=" +
            encodeURIComponent(nombre) +
            "&precio=" + precio +
            "&stock=" + stock +
            "&categoria=" + encodeURIComponent(categoria),
            {
                method:"POST"
            })
            .then(() => {

                mostrarMensaje("Producto agregado");

                cargarProductos();
                cargarResumen();

            });
    }

    cargarProductos();
    cargarResumen();

    async function agregarProducto() {

            let nombre = document.getElementById("nombre").value;
            let categoria = document.getElementById("categoria").value;
            let precio = document.getElementById("precio").value;
            let stock = document.getElementById("stock").value;

            await fetch(`/productos/nuevo?nombre=${nombre}&precio=${precio}&stock=${stock}&categoria=${categoria}`);

            location.reload();
        }

</script>

</body>
</html>
