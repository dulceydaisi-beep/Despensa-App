<!DOCTYPE html>
<html>
<head>
    <title>Despensa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 10px;
        }

        h2 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nombre {
            font-size: 18px;
            font-weight: bold;
        }

        .precio {
            color: green;
        }

        .stock {
            margin: 5px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            background: gray;
        }

        .agotado {
            color: red;
            font-weight: bold;
        }
    </style>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 10px;
        }

        h2 {
            text-align: center;
        }

        h3 {
            background: #333;
            color: white;
            padding: 8px;
            border-radius: 8px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .nombre {
            font-size: 20px;
            font-weight: bold;
        }

        .precio {
            color: green;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            background: gray;
        }

        .agotado {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<div id="mensaje" style="
    display:none;
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:green;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    z-index:1000;
">
    OK
</div>

<body>
<div id="resumen" style="display:flex; gap:10px; margin-bottom:20px;">
    <div style="background:#4CAF50; color:white; padding:15px; border-radius:10px;">
        📦 Productos: <span id="totalProductos">0</span>
    </div>

    <div style="background:#2196F3; color:white; padding:15px; border-radius:10px;">
        📊 Stock total: <span id="stockTotal">0</span>
    </div>

    <div style="background:#f44336; color:white; padding:15px; border-radius:10px;">
        ⚠️ Stock bajo: <span id="stockBajo">0</span>
    </div>
</div>

<h2> Mi Despensa</h2>
<button onclick="mostrarFormulario()"> Nuevo Producto</button>
<div id="formulario" style="display:none;">
    <input id="nombre" placeholder="Nombre"><br>
    <input id="precio" placeholder="Precio"><br>
    <input id="stock" placeholder="Stock"><br>
    <input id="categoria" placeholder="Categoría"><br>
    <button onclick="guardarProducto()">Guardar</button>
</div>
<ul id="productos"></ul>

<script>
    const API = ""; // 🔥 ahora automático

    function cargarProductos() {
        fetch("/productos")
            .then(respone => respone.json())
            .then(data => {
                console.log(data);

                let lista = document.getElementById("productos");
                lista.innerHTML = "";

                data.forEach(p => {
                    lista.innerHTML += `
                         <div class="card">
                             <div class="nombre">${p.nombre}</div>
                             <div class="precio">$${p.precio}</div>
                             <div class="stock">Stock: ${p.stock}</div>
                         </div>
                         `;
                });

                let html = "";

                for (let cat in categorias) {

                    let icono = "🛒";

                    if (cat.toLowerCase().includes("lacteo")) icono = "🥛";
                    if (cat.toLowerCase().includes("pan")) icono = "🍞";
                    if (cat.toLowerCase().includes("almacen")) icono = "🏪";
                    if (cat.toLowerCase().includes("bebida")) icono = "🥤";
                    if (cat.toLowerCase().includes("snack")) icono = "🍪";

                    html += `
<h3 onclick="toggleCategoria('${cat}')" style="cursor:pointer;">
        ${cat}
    </h3>
    <div id="cat-${cat.replace(/\s/g, '')}" style="display:none;">
`;

                    categorias[cat].forEach(p => {

                        let agotado = p.stock <= 0;
                        let bajo = p.stock > 0 && p.stock <= 5;

                        html += `
            <div class="card">
                <div class="nombre">${p.nombre}</div>
                <div class="precio">$${p.precio}</div>
                <div class="stock">
                    ${
                            agotado
                                ? '<span class="agotado">SIN STOCK</span>'
                                : bajo
                                    ? '<span style="color: orange; font-weight: bold;">POCO STOCK (' + p.stock + ')</span>'
                                    : 'Stock: ' + p.stock
                        }
                </div>

                <button onclick="vender(${p.id})" ${agotado ? 'disabled' : ''}>
                    Vender
                </button>

                <button onclick="agregar(${p.id})">
                    + Stock
                </button>

                <button onclick="editarPrecio(${p.id})">
                    Cambiar Precio
                </button>
            </div>
        `;
                    });
                    html += `</div>`;
                }

                document.getElementById("productos").innerHTML = html;

                document.getElementById("productos").innerHTML = html;
            });
    }
    function editarPrecio(id) {
        let nuevo = document.getElementById("inputPrecio");

        if (!nuevo) {
            let input = document.createElement("input");
            input.id = "inputPrecio";
            input.placeholder = "Nuevo precio";
            input.style.position = "fixed";
            input.style.bottom = "20px";
            input.style.left = "50%";
            input.style.transform = "translateX(-50%)";
            input.style.padding = "10px";
            input.style.borderRadius = "8px";

            document.body.appendChild(input);

            input.focus();

            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    enviarPrecio(id, input.value);
                    input.remove();
                }
            });
        }
    }
    function mostrarMensaje(texto) {
        let m = document.getElementById("mensaje");
        m.innerText = texto;
        m.style.display = "block";

        setTimeout(() => {
            m.style.display = "none";
        }, 1500);
    }

    function vender(id) {
        fetch(API + "/vender/" + id, { method: "POST" })
            .then(() => {
                mostrarMensaje("Venta realizada");
                cargarProductos();
            });
    }
    function agregar(id) {
        fetch(API + "/agregar/" + id, { method: "POST" })
            .then(() => {
                mostrarMensaje("Stock agregado");
                cargarProductos();
            });
    }
    function enviarPrecio(id, precio) {
        fetch(API + "/precio/" + id + "?precio=" + precio, {
            method: "POST"
        })
            .then(() => {
                mostrarMensaje("Precio actualizado");
                cargarProductos();
            });
    }
    function mostrarFormulario() {
        document.getElementById("formulario").style.display = "block";
    }

    function guardarProducto() {
        let nombre = document.getElementById("nombre").value;
        let precio = document.getElementById("precio").value;
        let stock = document.getElementById("stock").value;
        let categoria = document.getElementById("categoria").value;

        fetch(API + "/nuevo?nombre=" + encodeURIComponent(nombre) +
            "&precio=" + precio +
            "&stock=" + stock +
            "&categoria=" + encodeURIComponent(categoria), {
            method: "POST"
        })
            .then(() => {
                mostrarMensaje("Producto agregado");
                cargarProductos();
            });
    }
    function toggleCategoria(cat) {
        let div = document.getElementById("cat-" + cat);

        if (div.style.display === "none") {
            div.style.display = "block";
        } else {
            div.style.display = "none";
        }
    }

    cargarProductos();
</script>
<script>
    function cargarResumen() {
        fetch("/resumen")
            .then(res => res.json())
            .then(data => {
                document.getElementById("totalProductos").innerText = data.totalProductos;
                document.getElementById("stockTotal").innerText = data.stockTotal;
                document.getElementById("stockBajo").innerText = data.stockBajo;
            });
    }
    fetch("/productos/resumen")
        .then(res => res.json())
        .then(data => {
            document.getElementById("totalProductos").innerText = data.length;

            let totalStock = 0;
            let bajo = 0;

            data.forEach(P => {
                totalStock += p.stock;

                if (p.stock <= 5) {
                    bajo++;
                }
            });
            document.getElementById("stockTotal").innerText = totalStock;
            document.getElementById("stockBajo").innerText = Bajo;
        });

    cargarResumen();
</script>

</body>
</html>
