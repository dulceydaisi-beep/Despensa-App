<!DOCTYPE html>
<html>
<head>

    <title>DespenChain</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            padding:15px;
        }

        h1{
            text-align:center;
        }

        #resumen{
            display:flex;
            gap:10px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .box{
            flex:1;
            min-width:150px;
            color:white;
            padding:15px;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

        .verde{ background:#4CAF50; }
        .azul{ background:#2196F3; }
        .rojo{ background:#f44336; }

        .card{
            background:white;
            padding:15px;
            margin-bottom:15px;
            border-radius:12px;
            box-shadow:0 2px 6px rgba(0,0,0,0.2);
        }

        .nombre{
            font-size:20px;
            font-weight:bold;
        }

        .precio{
            color:green;
            font-size:18px;
            margin-top:5px;
        }

        .stock{
            margin-top:5px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:8px;
            border:none;
            border-radius:8px;
            color:white;
            font-size:15px;
            cursor:pointer;
        }

        .btn-vender{
            background:#e53935;
        }

        .btn-stock{
            background:#43a047;
        }

        .btn-precio{
            background:#1e88e5;
        }

        .btn-nuevo{
            background:#333;
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        #mensaje{
            display:none;
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            background:green;
            color:white;
            padding:12px 20px;
            border-radius:8px;
        }

    </style>

</head>

<body>

<h1>🛒 DespenChain</h1>

<div id="mensaje"></div>

<div id="resumen">

    <div class="box verde">
        📦 Productos:
        <span id="totalProductos">0</span>
    </div>

    <div class="box azul">
        📊 Stock:
        <span id="stockTotal">0</span>
    </div>

    <div class="box rojo">
        ⚠️ Bajo:
        <span id="stockBajo">0</span>
    </div>

</div>

<button class="btn-nuevo" onclick="mostrarFormulario()">
    ➕ Nuevo Producto
</button>

<div id="formulario" style="display:none; margin-bottom:20px;">

    <input id="nombre" placeholder="Nombre">
    <input id="precio" placeholder="Precio">
    <input id="stock" placeholder="Stock">
    <input id="categoria" placeholder="Categoría">

    <button class="btn-stock" onclick="guardarProducto()">
        Guardar
    </button>

</div>

<div id="productos"></div>

<script>

    function mostrarMensaje(texto){

        let m = document.getElementById("mensaje");

        m.innerText = texto;
        m.style.display = "block";

        setTimeout(() => {
            m.style.display = "none";
        },1500);
    }

    function mostrarFormulario(){

        let f = document.getElementById("formulario");

        if(f.style.display === "none"){
            f.style.display = "block";
        }else{
            f.style.display = "none";
        }
    }

    function cargarResumen(){

        fetch("/productos/resumen")
            .then(r => r.json())
            .then(data => {

                document.getElementById("totalProductos").innerText = data.totalProductos;
                document.getElementById("stockTotal").innerText = data.stockTotal;
                document.getElementById("stockBajo").innerText = data.stockBajo;

            });
    }

    function cargarProductos(){

        fetch("/productos")
            .then(r => r.json())
            .then(data => {

                let html = "";

                data.forEach(p => {

                    let estado = "";

                    if(p.stock <= 0){
                        estado = "<span style='color:red;font-weight:bold;'>SIN STOCK</span>";
                    }
                    else if(p.stock <= 5){
                        estado = "<span style='color:orange;font-weight:bold;'>POCO STOCK (" + p.stock + ")</span>";
                    }
                    else{
                        estado = "Stock: " + p.stock;
                    }

                    html += `

                        <div class="card">

                            <div class="nombre">
                                ${p.nombre}
                            </div>

                            <div>
                                ${p.categoria}
                            </div>

                            <div class="precio">
                                $${p.precio}
                            </div>

                            <div class="stock">
                                ${estado}
                            </div>

                            <button class="btn-vender"
                                onclick="vender(${p.id})">
                                Vender
                            </button>

                            <button class="btn-stock"
                                onclick="agregar(${p.id})">
                                + Stock
                            </button>

                            <button class="btn-precio"
                                onclick="editarPrecio(${p.id})">
                                Cambiar Precio
                            </button>

                        </div>

                    `;
                });

                document.getElementById("productos").innerHTML = html;

            });
    }

    function vender(id){

        fetch("/productos/vender/" + id,{
            method:"POST"
        })
            .then(() => {

                mostrarMensaje("Venta realizada");

                cargarProductos();
                cargarResumen();

            });
    }

    function agregar(id){

        fetch("/productos/agregar/" + id,{
            method:"POST"
        })
            .then(() => {

                mostrarMensaje("Stock agregado");

                cargarProductos();
                cargarResumen();

            });
    }

    function editarPrecio(id){

        let precio = prompt("Nuevo precio:");

        if(precio){

            fetch("/productos/precio/" + id + "?precio=" + precio,{
                method:"POST"
            })
                .then(() => {

                    mostrarMensaje("Precio actualizado");

                    cargarProductos();

                });
        }
    }

    function guardarProducto(){

        let nombre = document.getElementById("nombre").value;
        let precio = document.getElementById("precio").value;
        let stock = document.getElementById("stock").value;
        let categoria = document.getElementById("categoria").value;

        fetch("/productos/nuevo?nombre=" +
            encodeURIComponent(nombre) +
            "&precio=" + precio +
            "&stock=" + stock +
            "&categoria=" + encodeURIComponent(categoria),
            {
                method:"POST"
            })
            .then(() => {

                mostrarMensaje("Producto agregado");

                cargarProductos();
                cargarResumen();

            });
    }

    cargarProductos();
    cargarResumen();

</script>

</body>
</html>
